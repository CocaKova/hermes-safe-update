name: ci

# Static checks on every push. The end-to-end test installs current upstream Hermes Agent and
# runs real updates against it (good ones, broken ones, rollbacks), so it also runs every week:
# if upstream changes something this tool relies on, it shows up here before it reaches anyone.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m py_compile hermes-safe-update
      - run: python hermes-safe-update --help
      - run: shellcheck -S warning tests/e2e.sh examples/*/*

  e2e:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Linux: start a systemd user manager (the gateway installs as a user service)"
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          for _ in $(seq 1 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Install Hermes from a local fake upstream
        run: tests/e2e.sh --setup none
      - name: Scenarios
        run: tests/e2e.sh
      - if: always()
        name: Collect logs
        run: |
          mkdir -p e2e-logs
          for d in "$HOME/.hermes" "$(cygpath -u "${LOCALAPPDATA:-/nonexistent}" 2>/dev/null)/hermes"; do
            [ -d "$d/logs" ] && cp -r "$d/logs" "e2e-logs/" || true
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: e2e-logs/
          if-no-files-found: ignore
